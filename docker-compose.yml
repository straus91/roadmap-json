# ROADMAP card creator v2 — run the whole app with:   docker compose up
# then open http://localhost:8000
#
# Settings come from a `.env` file next to this file (copy .env.example to .env and add
# your API key). Compose reads `.env` automatically; nothing else needs to be configured.

services:
  app:
    build: .
    image: roadmap-cards
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_EFFORT: ${LLM_EFFORT:-medium}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_FALLBACKS: ${ANTHROPIC_FALLBACKS:-default}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PDF_MODE: ${PDF_MODE:-native}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-50}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-50}
      DAILY_LIMIT_PER_VISITOR: ${DAILY_LIMIT_PER_VISITOR:-5}
      PRICE_INPUT_PER_MTOK: ${PRICE_INPUT_PER_MTOK:-}
      PRICE_OUTPUT_PER_MTOK: ${PRICE_OUTPUT_PER_MTOK:-}
      SCHEMA_SYNC_HOURS: ${SCHEMA_SYNC_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - roadmap-data:/data   # spending ledger + latest ATLAS schema; survives restarts

volumes:
  roadmap-data:
