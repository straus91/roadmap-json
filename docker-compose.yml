# ROADMAP card creator v2 — run the whole app with:   docker compose up
# then open http://localhost:8000
#
# Settings come from a `.env` file next to this file (copy .env.example to .env and add
# your API key). Compose reads `.env` automatically; nothing else needs to be configured.

services:
  app:
    build: .
    image: roadmap-cards
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_EFFORT: ${LLM_EFFORT:-medium}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_FALLBACKS: ${ANTHROPIC_FALLBACKS:-default}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PDF_MODE: ${PDF_MODE:-native}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
